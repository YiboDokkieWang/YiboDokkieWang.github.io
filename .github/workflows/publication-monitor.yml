name: Publication Monitor

on:
  schedule:
    - cron: '17 9 1 * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:
    inputs:
      operation:
        description: '操作方式'
        required: true
        type: choice
        default: inventory
        options:
          - inventory
          - scan
          - add
          - self-test
          - simulate-new-journal
          - simulate-new-conference
          - simulate-new-patent
          - simulate-early-access-upgrade
      result_type:
        description: '成果类型'
        required: true
        type: choice
        default: auto
        options:
          - auto
          - journal
          - conference
          - patent
      input_kind:
        description: '输入方式'
        required: true
        type: choice
        default: auto
        options:
          - auto
          - doi
          - title
          - ieee
          - bibtex
          - patent
      input_value:
        description: 'DOI、题目、IEEE编号、专利号或BibTeX；非add操作可留空'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: publication-monitor
  cancel-in-progress: false

jobs:
  publication-monitor:
    if: github.event_name == 'schedule' || github.actor == 'YiboDokkieWang'
    runs-on: ubuntu-latest
    env:
      IEEE_API_KEY: ${{ secrets.IEEE_API_KEY }}
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      EPO_OPS_KEY: ${{ secrets.EPO_OPS_KEY }}
      EPO_OPS_SECRET: ${{ secrets.EPO_OPS_SECRET }}
      NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
      MANUAL_INPUT_VALUE: ${{ inputs.input_value }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run monitor
        id: monitor
        shell: bash
        run: |
          mkdir -p publication-monitor/output
          operation="${{ github.event_name == 'schedule' && 'scan' || inputs.operation }}"
          case "$operation" in
            self-test)
              node publication-monitor/cli.cjs self-test --output publication-monitor/output/report.json --markdown-output publication-monitor/output/report.md
              ;;
            inventory)
              node publication-monitor/cli.cjs inventory --output publication-monitor/output/report.json --markdown-output publication-monitor/output/report.md
              ;;
            scan)
              node publication-monitor/cli.cjs scan --output publication-monitor/output/report.json --markdown-output publication-monitor/output/report.md
              ;;
            add)
              node publication-monitor/cli.cjs identify --apply --type "${{ inputs.result_type }}" --input-kind "${{ inputs.input_kind }}" --value "$MANUAL_INPUT_VALUE" --output publication-monitor/output/report.json --markdown-output publication-monitor/output/report.md
              ;;
            simulate-new-journal)
              node publication-monitor/cli.cjs fixture --name new-journal --output publication-monitor/output/report.json --markdown-output publication-monitor/output/report.md
              ;;
            simulate-new-conference)
              node publication-monitor/cli.cjs fixture --name new-conference --output publication-monitor/output/report.json --markdown-output publication-monitor/output/report.md
              ;;
            simulate-new-patent)
              node publication-monitor/cli.cjs fixture --name new-patent --output publication-monitor/output/report.json --markdown-output publication-monitor/output/report.md
              ;;
            simulate-early-access-upgrade)
              node publication-monitor/cli.cjs fixture --name early-access-final --output publication-monitor/output/report.json --markdown-output publication-monitor/output/report.md
              ;;
            *)
              echo "Unknown operation: $operation" >&2
              exit 1
              ;;
          esac
          cat publication-monitor/output/report.md >> "$GITHUB_STEP_SUMMARY"
          changed=$(node -e "const r=require('./publication-monitor/output/report.json'); process.stdout.write(String(Boolean(r.changedPublications)))")
          actionable=$(node -e "const r=require('./publication-monitor/output/report.json'); process.stdout.write(String((r.counts?.missing || 0) + (r.counts?.upgrades || 0)))")
          echo "operation=$operation" >> "$GITHUB_OUTPUT"
          echo "changed_publications=$changed" >> "$GITHUB_OUTPUT"
          echo "actionable_count=$actionable" >> "$GITHUB_OUTPUT"

      - name: Create owner approval checklist
        if: steps.monitor.outputs.operation == 'scan' && steps.monitor.outputs.actionable_count != '0'
        shell: bash
        run: |
          has_issues=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.has_issues')
          if [ "$has_issues" != "true" ]; then
            echo "GitHub Issues must be enabled so the owner-only approval checklist can be created." >&2
            exit 1
          fi
          gh label create publication-review --color 1D76DB --description "Owner approval for publication monitor results" --force
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          node publication-monitor/approval-cli.cjs render \
            --report publication-monitor/output/report.json \
            --output publication-monitor/output/approval.md \
            --run-url "$run_url"
          issue_url=$(gh issue create \
            --title "发表成果待确认：请选择本次新增成果" \
            --body-file publication-monitor/output/approval.md \
            --label publication-review \
            --assignee YiboDokkieWang)
          echo "## 请在登录 GitHub 后勾选成果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${issue_url}" >> "$GITHUB_STEP_SUMMARY"

      - name: Create publication update pull request
        if: steps.monitor.outputs.changed_publications == 'true'
        shell: bash
        run: |
          branch="automation/publication-monitor-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add contents/publications.md contents/zh/publications.md publication-monitor/state.json
          git commit -m "Propose publication website update"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "发表成果监测：请确认网站更新" \
            --body-file publication-monitor/output/report.md \
            --reviewer YiboDokkieWang

      - name: Save scan state and patent cache
        if: steps.monitor.outputs.operation == 'scan'
        shell: bash
        run: |
          if git diff --quiet -- publication-monitor/state.json publication-monitor/cache/patents.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publication-monitor/state.json publication-monitor/cache/patents.json
          git commit -m "Record publication scan state"
          git pull --rebase origin main
          git push origin main

      - name: Notify manual run with a report issue
        if: github.event_name == 'workflow_dispatch' && steps.monitor.outputs.operation != 'scan'
        shell: bash
        run: |
          has_issues=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.has_issues')
          if [ "$has_issues" != "true" ]; then
            echo "Repository Issues are disabled. The complete report is available in this workflow summary and, when changes exist, in the generated pull request." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          issue=$(gh issue list --state open --search '发表成果扫描报告 in:title' --json number --jq '.[0].number')
          if [ -z "$issue" ]; then
            issue=$(gh issue create \
              --title "发表成果扫描报告" \
              --body "@YiboDokkieWang 手动检查报告会集中记录在这里。" \
              --assignee YiboDokkieWang | awk -F/ '{print $NF}')
          fi
          gh issue comment "$issue" --body-file publication-monitor/output/report.md
