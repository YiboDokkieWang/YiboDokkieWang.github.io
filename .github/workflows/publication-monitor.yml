name: Publication Monitor

on:
  schedule:
    - cron: '17 9 1 * *'
      timezone: 'Asia/Shanghai'
  issues:
    types: [edited]
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [publication_manager_add]
  workflow_dispatch:
    inputs:
      operation:
        description: '操作方式'
        required: true
        type: choice
        default: scan
        options:
          - scan
          - add
      result_type:
        description: '成果类型'
        required: true
        type: choice
        default: auto
        options:
          - auto
          - journal
          - conference
          - patent
      input_kind:
        description: '输入方式'
        required: true
        type: choice
        default: auto
        options:
          - auto
          - doi
          - title
          - ieee
          - bibtex
          - patent
      input_value:
        description: 'DOI、题目、IEEE编号、专利号或BibTeX；非add操作可留空'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: publication-monitor
  cancel-in-progress: false

jobs:
  publication-monitor:
    if: github.event_name == 'schedule' || ((github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && github.actor == 'YiboDokkieWang')
    runs-on: ubuntu-latest
    env:
      IEEE_API_KEY: ${{ secrets.IEEE_API_KEY }}
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
      MANUAL_INPUT_VALUE: ${{ inputs.input_value }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Run monitor
        id: monitor
        shell: bash
        run: |
          mkdir -p publication-monitor/output
          if [ "${{ github.event_name }}" = "schedule" ]; then
            operation="scan"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            operation="online-add"
          else
            operation="${{ inputs.operation }}"
          fi
          case "$operation" in
            scan)
              node publication-monitor/cli.cjs scan --output publication-monitor/output/report.json --markdown-output publication-monitor/output/report.md
              ;;
            add)
              node publication-monitor/cli.cjs identify --apply --type "${{ inputs.result_type }}" --input-kind "${{ inputs.input_kind }}" --value "$MANUAL_INPUT_VALUE" --output publication-monitor/output/report.json --markdown-output publication-monitor/output/report.md
              ;;
            online-add)
              node -e "const fs=require('fs'); const event=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')); fs.writeFileSync('publication-monitor/output/online-record.json', JSON.stringify(event.client_payload?.record || {}))"
              node publication-monitor/cli.cjs apply-record --record-file publication-monitor/output/online-record.json --output publication-monitor/output/report.json --markdown-output publication-monitor/output/report.md
              ;;
            *)
              echo "Unknown operation: $operation" >&2
              exit 1
              ;;
          esac
          cat publication-monitor/output/report.md >> "$GITHUB_STEP_SUMMARY"
          changed=$(node -e "const r=require('./publication-monitor/output/report.json'); process.stdout.write(String(Boolean(r.changedPublications)))")
          actionable=$(node -e "const r=require('./publication-monitor/output/report.json'); process.stdout.write(String((r.counts?.missing || 0) + (r.counts?.upgrades || 0)))")
          echo "operation=$operation" >> "$GITHUB_OUTPUT"
          echo "changed_publications=$changed" >> "$GITHUB_OUTPUT"
          echo "actionable_count=$actionable" >> "$GITHUB_OUTPUT"

      - name: Create owner approval checklist
        if: steps.monitor.outputs.operation == 'scan' && (steps.monitor.outputs.actionable_count != '0' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          has_issues=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.has_issues')
          if [ "$has_issues" != "true" ]; then
            echo "GitHub Issues must be enabled so the owner-only approval checklist can be created." >&2
            exit 1
          fi
          gh label create publication-review --color 1D76DB --description "Owner approval for publication monitor results" --force
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          node publication-monitor/approval-cli.cjs render \
            --report publication-monitor/output/report.json \
            --output publication-monitor/output/approval.md \
            --run-url "$run_url"
          if [ "${{ steps.monitor.outputs.actionable_count }}" = "0" ]; then
            issue_title="发表成果扫描完成：请查看本次结果"
          else
            issue_title="发表成果待确认：请选择本次新增成果"
          fi
          issue_url=$(gh issue create \
            --title "$issue_title" \
            --body-file publication-monitor/output/approval.md \
            --label publication-review)
          node publication-monitor/approval-cli.cjs render \
            --report publication-monitor/output/report.json \
            --output publication-monitor/output/approval.md \
            --run-url "$run_url" \
            --issue-url "$issue_url"
          gh issue edit "$issue_url" --body-file publication-monitor/output/approval.md
          node publication-monitor/approval-cli.cjs render-notification \
            --report publication-monitor/output/report.json \
            --output publication-monitor/output/notification.md \
            --run-url "$run_url" \
            --issue-url "$issue_url"
          gh issue comment "$issue_url" --body-file publication-monitor/output/notification.md
          echo "## 请确认新增成果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[打开本次成果确认页面](${issue_url})" >> "$GITHUB_STEP_SUMMARY"

      - name: Create publication update pull request
        if: steps.monitor.outputs.changed_publications == 'true' && github.event_name != 'repository_dispatch'
        shell: bash
        run: |
          branch="automation/publication-monitor-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add contents/publications.md contents/zh/publications.md publication-monitor/state.json
          git commit -m "Propose publication website update"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "发表成果监测：请确认网站更新" \
            --body-file publication-monitor/output/report.md \
            --reviewer YiboDokkieWang

      - name: Publish online manager addition
        if: steps.monitor.outputs.changed_publications == 'true' && github.event_name == 'repository_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contents/publications.md contents/zh/publications.md publication-monitor/state.json
          git commit -m "Add publication from online manager"
          git pull --rebase origin main
          git push origin main
          echo "## 在线成果已发布" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "个人网站将在GitHub Pages构建完成后显示新成果。" >> "$GITHUB_STEP_SUMMARY"

      - name: Save scan state and patent cache
        if: steps.monitor.outputs.operation == 'scan'
        shell: bash
        run: |
          if git diff --quiet -- publication-monitor/state.json publication-monitor/cache/patents.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publication-monitor/state.json publication-monitor/cache/patents.json
          git commit -m "Record publication scan state"
          git pull --rebase origin main
          git push origin main

      - name: Notify manual run with a report issue
        if: github.event_name == 'workflow_dispatch' && steps.monitor.outputs.operation != 'scan'
        shell: bash
        run: |
          has_issues=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.has_issues')
          if [ "$has_issues" != "true" ]; then
            echo "Repository Issues are disabled. The complete report is available in this workflow summary and, when changes exist, in the generated pull request." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          issue=$(gh issue list --state open --search '发表成果扫描报告 in:title' --json number --jq '.[0].number')
          if [ -z "$issue" ]; then
            issue=$(gh issue create \
              --title "发表成果扫描报告" \
              --body "@YiboDokkieWang 手动检查报告会集中记录在这里。" \
              --assignee YiboDokkieWang | awk -F/ '{print $NF}')
          fi
          gh issue comment "$issue" --body-file publication-monitor/output/report.md

  apply-owner-selection:
    if: (github.event_name == 'issues' || github.event_name == 'issue_comment') && github.actor == 'YiboDokkieWang' && contains(github.event.issue.labels.*.name, 'publication-review')
    runs-on: ubuntu-latest
    env:
      IEEE_API_KEY: ${{ secrets.IEEE_API_KEY }}
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Read owner selection
        id: selection
        shell: bash
        run: |
          mkdir -p publication-monitor/output
          node -e "const fs=require('fs'); const event=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')); fs.writeFileSync('publication-monitor/output/issue-body.md', event.issue.body || ''); fs.writeFileSync('publication-monitor/output/comment-body.md', event.comment?.body || '')"
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            node publication-monitor/approval-cli.cjs parse \
              --body publication-monitor/output/issue-body.md \
              --comment publication-monitor/output/comment-body.md \
              --output publication-monitor/output/selection.json
          else
            node publication-monitor/approval-cli.cjs parse \
              --body publication-monitor/output/issue-body.md \
              --output publication-monitor/output/selection.json
          fi
          confirmed=$(node -e "const s=require('./publication-monitor/output/selection.json'); process.stdout.write(String(Boolean(s.confirmed)))")
          count=$(node -e "const s=require('./publication-monitor/output/selection.json'); process.stdout.write(String(s.selectedIdentifiers.length))")
          invalid=$(node -e "const s=require('./publication-monitor/output/selection.json'); process.stdout.write(String((s.invalidSelections || []).length))")
          echo "confirmed=$confirmed" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "invalid=$invalid" >> "$GITHUB_OUTPUT"

      - name: Explain invalid email selection
        if: steps.selection.outputs.invalid != '0'
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "邮件回复中包含不存在的编号。请只回复一行，例如：\`确认：1,2,5\`。"

      - name: Record empty confirmation
        if: steps.selection.outputs.confirmed == 'true' && steps.selection.outputs.count == '0' && steps.selection.outputs.invalid == '0'
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "你没有勾选任何成果，本次不会修改网站。确认页现已关闭。"
          gh issue close "${{ github.event.issue.number }}"

      - name: Apply selected publications
        id: apply
        if: steps.selection.outputs.confirmed == 'true' && steps.selection.outputs.count != '0' && steps.selection.outputs.invalid == '0'
        shell: bash
        run: |
          node publication-monitor/cli.cjs scan \
            --apply \
            --selected-file publication-monitor/output/selection.json \
            --output publication-monitor/output/report.json \
            --markdown-output publication-monitor/output/report.md
          changed=$(node -e "const r=require('./publication-monitor/output/report.json'); process.stdout.write(String(Boolean(r.changedPublications)))")
          if [ "$changed" != "true" ]; then
            echo "The selected publications did not produce a website change." >&2
            exit 1
          fi

      - name: Publish selected publications
        if: steps.selection.outputs.confirmed == 'true' && steps.selection.outputs.count != '0' && steps.selection.outputs.invalid == '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contents/publications.md contents/zh/publications.md publication-monitor/state.json
          git commit -m "Add owner-approved publications"
          git push origin main
          commit_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/$(git rev-parse HEAD)"
          gh issue comment "${{ github.event.issue.number }}" --body "已按你的勾选结果更新个人网站：${commit_url}。GitHub Pages 将自动发布新版本。"
          gh issue close "${{ github.event.issue.number }}"

      - name: Report approval failure
        if: failure() && steps.selection.outputs.confirmed == 'true'
        shell: bash
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue comment "${{ github.event.issue.number }}" --body "自动更新没有完成，请查看运行记录：${run_url}。确认页保持打开；修复问题后可以取消并重新勾选最终确认项。"
